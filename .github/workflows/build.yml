name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачивание исходного кода из репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Настройка JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Выдача прав на выполнение gradlew (с указанием working-directory, если проект в подпапке)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        # Если ваш файл gradlew лежит не в корне, раскомментируйте строчку ниже и укажите путь:
        # working-directory: android 

      # 4. Сборка Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug
        # working-directory: android # Укажите тот же путь, если проект в подпапке

      # 5. Загрузка готового APK в артефакты сборки
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
